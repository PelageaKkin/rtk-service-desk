openapi: 3.0.0
info:
  title: API Панели управления внедрением ИС
  description: Контракт для взаимодействия Frontend и Backend
  version: 1.0.0
paths:
  /api/projects:
    get:
      summary: Получить список всех проектов
      responses:
        '200':
          description: Успешный ответ (список проектов с цветовым статусом)
  /api/tasks:
    post:
      summary: Создать новую задачу
      responses:
        '201':
          description: Задача создана
  /api/projects/{id}/status:
    get:
      summary: Получить статус конкретного проекта
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Статус проекта (в срок, риски, блокер)
